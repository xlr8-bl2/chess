<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess Simulator</title>
  <meta name="description" content="Play chess against the computer, switch sides at any time, and pick a difficulty from Beginner to Grandmaster.">
  <meta name="theme-color" content="#1e1f24">
  <link rel="icon" href="pieces/wN.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="board-area">
      <div class="player-bar top" id="barTop">
        <span class="who" id="nameTop"></span>
        <span class="captured" id="capTop"></span>
      </div>
      <div class="board-wrap">
        <div class="board" id="board" aria-label="Chess board"></div>
        <div class="promo" id="promo" hidden>
          <div class="promo-box" id="promoBox"></div>
        </div>
      </div>
      <div class="player-bar bottom" id="barBottom">
        <span class="who" id="nameBottom"></span>
        <span class="captured" id="capBottom"></span>
      </div>
    </section>

    <aside class="panel">
      <h1>Chess Simulator</h1>

      <div class="status" id="status" role="status" aria-live="polite"></div>

      <div class="group">
        <div class="row between">
          <span>You play <strong id="sideLabel">White</strong></span>
          <button class="btn primary" id="switchBtn" title="Swap sides — the computer takes over the color you leave">⇄ Switch sides</button>
        </div>
      </div>

      <div class="group">
        <label for="level" class="label">Computer difficulty</label>
        <select id="level"></select>
        <input type="range" id="levelRange" min="0" max="7" step="1" aria-label="Difficulty">
        <div class="hint" id="levelInfo"></div>
      </div>

      <div class="group buttons">
        <button class="btn" id="newBtn">New game</button>
        <button class="btn" id="undoBtn">Undo</button>
        <button class="btn" id="flipBtn">Flip board</button>
        <button class="btn" id="hintBtn">Hint</button>
      </div>

      <div class="group">
        <div class="label">Moves</div>
        <ol class="moves" id="moves"></ol>
      </div>

      <div class="engine-note" id="engineNote"></div>
    </aside>
  </main>

  <script src="js/chess.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
